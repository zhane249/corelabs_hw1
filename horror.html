    <script>
        //refer to references in ReadME page

        //reload
window.addEventListener("load",() => {
    let manhuas = document.querySelectorAll(".horror-page");
//random slot list array (slot 1, 9, and 10 not shuffled in general due to special dimensions)
    let slots =["slot2", "slot3", "slot4","slot5","slot6","slot7", "slot8",];


for(let i =0; i<slots.length; ++i){

    let random = randomNumber();
    //current
    let oldSlot = slots[i];

    slots[i] = slots[random];
    slots[random] = oldSlot;
}
//new slots manhua2-8
for(let i = 1; i<8; ++i){
    manhuas[i].classList.remove("slot"+ (i+1));
    manhuas[i].classList.add(slots[i-1]);
}
//slots 1 and 9 special shuffle switch
let switchImages = Math.floor(Math.random() *2);

if (switchImages ==1){
    manhuas[0].classList.remove("slot1");
    manhuas[0].classList.add("slot9");
    manhuas[8].classList.remove("slot9")
    manhuas[8].classList.add("slot1");
}
});
function randomNumber(){
    return Math.floor(Math.random()*7);

}
        </script>
